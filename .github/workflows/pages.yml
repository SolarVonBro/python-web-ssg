name: Build & Deploy

on:
  push:
    branches: ["**"]          # любая ветка: lint + build; deploy — только main
  pull_request:               # из форка секреты недоступны -> deploy не выполняется
  workflow_dispatch:

permissions:
  contents: read              # минимум прав по умолчанию

env:
  PYTHON_VERSION: "3.14"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/run_experiment.py && python scripts/stamp.py
      - name: mkdocs build --strict (битые ссылки = ошибка)
        run: mkdocs build --strict

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements.txt
      # P3: кэш результатов эксперимента. Ключ = хеш данных и скриптов.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache
            docs/generated
          key: experiment-${{ hashFiles('data/**', 'scripts/run_experiment.py') }}
      - id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build for GitHub Pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'http://localhost/' }}
        run: make site PY=python
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: {path: site}
      # Сборка для Yandex Object Storage (корень бакета, свой site_url)
      - name: Build for Yandex Object Storage
        if: github.ref == 'refs/heads/main' && vars.YC_SITE_URL != ''
        env:
          SITE_URL: ${{ vars.YC_SITE_URL }}
        run: mkdocs build --strict -d site-yandex
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && vars.YC_SITE_URL != ''
        with: {name: site-yandex, path: site-yandex}

  deploy-yandex:
    # только main, не PR, и только если настроен бакет (переменная YC_BUCKET)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.YC_BUCKET != ''
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}          # ключ сервисного аккаунта,
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}  # права только на один бакет
      AWS_DEFAULT_REGION: ru-central1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: ${{ vars.YC_BUCKET }}
      URL: ${{ vars.YC_SITE_URL }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: site-yandex, path: site-yandex}
      - name: Sync to Object Storage (S3 API, --delete убирает устаревшие файлы)
        run: |
          start=$(date +%s)
          aws s3 sync site-yandex/ "s3://$BUCKET/" --delete --endpoint-url https://storage.yandexcloud.net
          echo "deploy time: $(( $(date +%s) - start )) s"
      - name: Healthcheck (код 200 + контрольная строка; иначе job падает)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o page.html -w '%{http_code}' "${URL}results/") && [ "$code" = 200 ] && grep -q 'pipeline-ok-p3' page.html && echo "healthcheck OK" && exit 0
            sleep 5
          done
          echo "healthcheck FAILED (last code: $code)"; exit 1

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}   # права только на этом job
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
